<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System — نظام إدارة المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ═══════════════════════════════════════ Design tokens ═══════════════════════════════════════ */
:root{
  --primary:#0F172A; --primary-light:#1E293B; --primary-lighter:#334155;
  --accent:#6366F1; --accent-dark:#4F46E5; --accent-soft:#EEF2FF;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-alt:#F1F5F9; --surface-hover:#F8FAFC;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --text:#0F172A; --text-2:#64748B; --text-muted:#94A3B8; --on-dark:#F8FAFC; --on-dark-muted:#94A3B8;
  --success:#059669; --success-soft:#ECFDF5; --warning:#D97706; --warning-soft:#FFFBEB;
  --danger:#DC2626; --danger-soft:#FEF2F2; --info:#0284C7; --info-soft:#F0F9FF;
  --return:#C2410C;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:16px; --s-xl:20px; --s-2xl:24px; --s-3xl:32px;
  --shadow-soft:0 2px 12px rgba(15,23,42,.04), 0 1px 2px rgba(0,0,0,.02);
  --shadow-lift:0 8px 24px rgba(15,23,42,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-overlay:0 16px 40px rgba(15,23,42,.12);
  --sidebar-w:264px; --sidebar-w-collapsed:76px; --header-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none}
ul{list-style:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-pill)}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ═══════════════════════════════════════ Layout ═══════════════════════════════════════ */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s-2xl)}
.page-stretch{display:flex;flex-direction:column;overflow:hidden}
.page-stretch > *{flex-shrink:0}

/* ═══════════════════════════════════════ Sidebar ═══════════════════════════════════════ */
.sidebar{width:var(--sidebar-w);background:var(--primary);display:flex;flex-direction:column;flex-shrink:0;transition:width .22s ease}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.brand{height:var(--header-h);display:flex;align-items:center;gap:var(--s-md);padding:0 var(--s-lg);flex-shrink:0}
.brand-logo{width:42px;height:42px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--accent),#8B5CF6);display:grid;place-items:center;color:#fff;font-size:19px;flex-shrink:0;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.brand-text{min-width:0;flex:1}
.brand-text h1{font-size:15px;font-weight:700;color:var(--on-dark);white-space:nowrap}
.brand-text p{font-size:11px;color:var(--on-dark-muted);white-space:nowrap}
.collapse-btn{width:30px;height:30px;border-radius:var(--r-sm);color:var(--on-dark-muted);display:grid;place-items:center;transition:.15s;flex-shrink:0}
.collapse-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-title,.sidebar.collapsed .nav-label,.sidebar.collapsed .shift-card{display:none}
.sidebar.collapsed .brand{justify-content:center;padding:0}
.sidebar.collapsed .collapse-btn{display:none}
.nav{flex:1;overflow-y:auto;padding:var(--s-sm) var(--s-md) var(--s-lg)}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.nav-title{font-size:10.5px;font-weight:700;color:#64748B;letter-spacing:.8px;padding:var(--s-lg) var(--s-md) var(--s-sm)}
.nav-item{display:flex;align-items:center;gap:var(--s-md);padding:10px var(--s-md);border-radius:var(--r-md);color:#CBD5E1;cursor:pointer;transition:.15s;margin-bottom:2px;position:relative;white-space:nowrap}
.nav-item i{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.nav-label{font-size:13.5px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,.32)}
.nav-item.active .nav-label{font-weight:700}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px 0}
.shift-card{margin:0 var(--s-md) var(--s-md);padding:var(--s-lg);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg)}
.shift-row{display:flex;align-items:center;gap:var(--s-sm);margin-bottom:var(--s-sm)}
.shift-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(5,150,105,.7)}
.shift-dot.off{background:var(--text-muted);box-shadow:none}
.shift-title{font-size:12.5px;font-weight:700;color:var(--on-dark)}
.shift-label{font-size:10.5px;color:var(--on-dark-muted)}
.shift-value{font-size:17px;font-weight:700;color:#fff;margin:2px 0 var(--s-md)}
.shift-btn{width:100%;padding:9px;border-radius:var(--r-sm);background:rgba(255,255,255,.09);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.shift-btn:hover{background:rgba(255,255,255,.16)}

/* ═══════════════════════════════════════ Header ═══════════════════════════════════════ */
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s-lg);padding:0 var(--s-2xl);flex-shrink:0}
.header-title h2{font-size:19px;font-weight:700;line-height:1.2}
.header-title p{font-size:11.5px;color:var(--text-2)}
.header-spacer{flex:1}
.branch-select{display:flex;align-items:center;gap:var(--s-sm);height:44px;padding:0 var(--s-md);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.branch-select:hover{border-color:var(--border-strong);background:var(--surface-alt)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);position:relative;transition:.15s}
.icon-btn:hover{background:var(--surface-alt);color:var(--text)}
.badge-dot{position:absolute;top:6px;left:6px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--r-pill);background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.user-chip{display:flex;align-items:center;gap:var(--s-md);padding-right:var(--s-lg);border-right:1px solid var(--border)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.user-name{font-size:13.5px;font-weight:600;text-align:left}
.user-role{font-size:11px;color:var(--text-2);text-align:left}

/* ═══════════════════════════════════════ Typography / bits ═══════════════════════════════════════ */
.page-title{font-size:24px;font-weight:700;line-height:1.3}
.page-sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.section-title{font-size:17px;font-weight:700}
.card-title{font-size:15px;font-weight:600}
.caption{font-size:12.5px;color:var(--text-2)}
.label{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.2px}
.amount{font-weight:600;font-variant-numeric:tabular-nums}
.amount-lg{font-size:20px;font-weight:700}
.amount-hero{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.muted{color:var(--text-muted)}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}.text-accent{color:var(--accent)}
.row{display:flex;align-items:center}
.gap-sm{gap:var(--s-sm)}.gap-md{gap:var(--s-md)}.gap-lg{gap:var(--s-lg)}
.spacer{flex:1}
.mt-lg{margin-top:var(--s-lg)}.mt-xl{margin-top:var(--s-xl)}.mt-2xl{margin-top:var(--s-2xl)}
.mb-lg{margin-bottom:var(--s-lg)}

/* ═══════════════════════════════════════ Cards ═══════════════════════════════════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-soft)}
.card-pad{padding:var(--s-xl)}
.card-head{padding:var(--s-xl);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s-md)}
.card-icon{width:38px;height:38px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-lg)}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);padding:var(--s-xl);display:flex;flex-direction:column;gap:var(--s-md)}
.stat-top{display:flex;align-items:flex-start;gap:var(--s-md)}
.stat-ico{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.stat-title{font-size:12.5px;color:var(--text-2);font-weight:500}
.stat-value{font-size:24px;font-weight:700;letter-spacing:-.3px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-change{display:flex;align-items:center;gap:5px;font-size:11.5px}
.chg{display:inline-flex;align-items:center;gap:3px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill);font-size:11px}
.chg.up{background:var(--success-soft);color:var(--success)}
.chg.down{background:var(--danger-soft);color:var(--danger)}
.chg.flat{background:var(--surface-alt);color:var(--text-2)}

/* ═══════════════════════════════════════ Buttons ═══════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-sm);height:46px;padding:0 var(--s-xl);border-radius:var(--r-md);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn i{font-size:15px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.2)}
.btn-primary:hover{background:var(--accent-dark);box-shadow:0 8px 20px rgba(99,102,241,.3)}
.btn-secondary{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface-alt);border-color:var(--border-strong);color:var(--text)}
.btn-secondary.accent{color:var(--accent);border-color:rgba(99,102,241,.35)}
.btn-secondary.accent:hover{background:var(--accent-soft)}
.btn-secondary.danger{color:var(--danger);border-color:rgba(220,38,38,.3)}
.btn-secondary.danger:hover{background:var(--danger-soft)}
.btn-secondary.success{color:var(--success);border-color:rgba(5,150,105,.3)}
.btn-secondary.success:hover{background:var(--success-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-sm{height:34px;padding:0 var(--s-md);font-size:12.5px;border-radius:var(--r-sm)}
.btn-lg{height:52px;font-size:15px}
.btn-hero{height:60px;font-size:16px;border-radius:var(--r-lg)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-icon{width:34px;height:34px;padding:0;border-radius:var(--r-sm);background:var(--surface-alt);border:1px solid var(--border);color:var(--text-2);display:grid;place-items:center;transition:.13s}
.btn-icon:hover{background:var(--accent-soft);border-color:rgba(99,102,241,.3);color:var(--accent)}
.btn-icon.danger:hover{background:var(--danger-soft);border-color:rgba(220,38,38,.3);color:var(--danger)}

/* ═══════════════════════════════════════ Forms ═══════════════════════════════════════ */
.field{display:flex;flex-direction:column;gap:var(--s-sm);flex:1;min-width:0}
.field > label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.req{color:var(--danger);font-weight:700}
.input,.select,textarea.input{height:48px;padding:0 var(--s-md);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;transition:.15s;width:100%}
textarea.input{height:auto;padding:var(--s-md);resize:vertical;line-height:1.6}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.input::placeholder{color:var(--text-muted)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.1)}
.err-msg{font-size:11.5px;color:var(--danger)}
.select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:left 12px center;padding-left:34px}
.search-box{position:relative;flex-shrink:0}
.search-box i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px}
.search-box .input{padding-right:36px;height:46px}
.switch{width:42px;height:24px;border-radius:var(--r-pill);background:var(--border-strong);position:relative;transition:.2s;flex-shrink:0;cursor:pointer}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{right:21px}
.check{width:19px;height:19px;border-radius:5px;border:2px solid var(--border-strong);display:grid;place-items:center;cursor:pointer;transition:.15s;flex-shrink:0;background:var(--surface)}
.check.on{background:var(--return);border-color:var(--return)}
.check.on::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;color:#fff;font-size:10px}

/* ═══════════════════════════════════════ Tables ═══════════════════════════════════════ */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);overflow:hidden;display:flex;flex-direction:column;min-height:0;max-width:100%}
.tbl-wrap{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface-alt);font-size:12.5px;font-weight:600;color:var(--text-2);text-align:right;padding:14px var(--s-lg);white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--text)}
thead th i{margin-right:5px;font-size:10px;opacity:.55}
tbody td{padding:12px var(--s-lg);border-bottom:1px solid rgba(226,232,240,.7);font-size:13.5px;vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-hover)}
tbody tr:last-child td{border-bottom:none}
.tbl-foot{padding:var(--s-md) var(--s-xl);border-top:1px solid var(--border);display:flex;align-items:center;gap:var(--s-md);font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.row-actions{display:flex;gap:6px;opacity:0;transition:.15s}
tbody tr:hover .row-actions{opacity:1}
.cell-main{font-weight:500;font-size:13.5px}
.cell-sub{font-size:11.5px;color:var(--text-2);margin-top:1px}
.thumb{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.thumb.circle{border-radius:50%}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}

/* Pagination */
.pager{display:flex;align-items:center;gap:5px}
.pg{min-width:32px;height:32px;padding:0 8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2);display:grid;place-items:center;transition:.13s}
.pg:hover:not(:disabled){background:var(--surface-alt);color:var(--text)}
.pg.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg:disabled{opacity:.4;cursor:not-allowed}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.success{background:var(--success-soft);color:var(--success)}
.badge.warning{background:var(--warning-soft);color:var(--warning)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.neutral{background:var(--surface-alt);color:var(--text-2)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}

/* Empty / loading */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px var(--s-xl);text-align:center;gap:var(--s-md);flex:1}
.empty-ico{width:64px;height:64px;border-radius:50%;background:var(--surface-alt);color:var(--text-muted);display:grid;place-items:center;font-size:26px}
.empty h4{font-size:15px;font-weight:600}
.empty p{font-size:13px;color:var(--text-2);max-width:420px}
.skeleton{background:linear-gradient(90deg,var(--surface-alt) 25%,#E8EDF3 50%,var(--surface-alt) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.track{height:6px;background:var(--surface-alt);border-radius:var(--r-pill);overflow:hidden;flex:1}
.track > div{height:100%;border-radius:var(--r-pill);transition:width .3s}

/* Pills / chips / tabs */
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 var(--s-md);border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-2);transition:.14s;white-space:nowrap}
.chip:hover{background:var(--surface-alt)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
.chip.on.soft{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);gap:4px;box-shadow:var(--shadow-soft);flex-shrink:0}
.seg button{height:38px;padding:0 var(--s-lg);border-radius:10px;font-size:12.5px;font-weight:500;color:var(--text-2);transition:.14s;display:flex;align-items:center;gap:7px}
.seg button:hover{background:var(--surface-alt)}
.seg button.on{background:var(--primary);color:#fff;font-weight:700}
.tabs{display:flex;gap:3px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-soft);width:fit-content;max-width:100%;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
.tabs button{flex-shrink:0}
.tabs button{height:42px;padding:0 var(--s-lg);border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text-2);display:flex;align-items:center;gap:var(--s-sm);white-space:nowrap;transition:.14s}
.tabs button:hover{background:var(--surface-alt)}
.tabs button.on{background:var(--primary);color:#fff;font-weight:700}

/* Nav tile (settings + reports side list) */
.nav-tile{display:flex;align-items:center;gap:var(--s-md);padding:var(--s-md);border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;transition:.15s;margin-bottom:var(--s-sm);width:100%;text-align:right}
.nav-tile:hover{background:var(--surface-alt)}
.nav-tile.on{background:var(--accent-soft);border-color:var(--accent)}
.nav-tile-ico{width:34px;height:34px;border-radius:var(--r-sm);background:rgba(99,102,241,.1);color:var(--accent);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.nav-tile.on .nav-tile-ico{background:var(--accent);color:#fff}
.nav-tile h5{font-size:13.5px;font-weight:500}
.nav-tile.on h5{font-weight:700;color:var(--accent)}

.modal-head .card-icon{width:40px;height:40px;border-radius:var(--r-md);font-size:18px}

.modal-foot{padding:var(--s-xl) var(--s-2xl);border-top:1px solid var(--border);display:flex;gap:var(--s-md);background:var(--bg);border-radius:0 0 var(--r-xl) var(--r-xl);flex-shrink:0}
.x-btn{width:36px;height:36px;border-radius:var(--r-sm);color:var(--text-2);display:grid;place-items:center;transition:.15s}

/* Toast */
.toasts{position:fixed;bottom:var(--s-2xl);left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:var(--s-sm);align-items:center}
.toast{display:flex;align-items:center;gap:var(--s-md);padding:14px var(--s-xl);background:var(--primary);color:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-overlay);font-size:13.5px;font-weight:500;min-width:300px;max-width:520px;animation:slideUp .22s ease}

.toast.out{animation:fadeOut .2s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}

.toast.ok i{color:#6EE7B7}.toast.err i{color:#FCA5A5}.toast.warn i{color:#FCD34D}

/* ═══════════════════════════════════════ Responsive ═══════════════════════════════════════ */

}
@media print{
  .sidebar,.header,.no-print{display:none!important}
  .page{overflow:visible;padding:0}
  body{overflow:visible}
}

/* سلسلة المبيعات اليومية — أرقام ثابتة مشتقّة من التاريخ عشان الرسوم تفضل ثابتة */
const DAILY_SERIES=(()=>{
  const out=[]; const start=new Date(TODAY); start.setDate(start.getDate()-364);
  for(let i=0;i<365;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const seed=(d.getFullYear()*373+(d.getMonth()+1)*31+d.getDate()*17)%97;
    const weekend=(d.getDay()===5||d.getDay()===6)?1.28:1;
    const trend=1+(i/365)*0.42;
    const sales=Math.round((14000+seed*180)*weekend*trend);
    out.push({date:d,sales,profit:Math.round(sales*(0.235+(seed%9)/300)),invoices:Math.round(sales/(210+seed%40)),
      cash:Math.round(sales*0.46),card:Math.round(sales*0.31),wallet:Math.round(sales*0.14),credit:Math.round(sales*0.09)});
  }
  return out;
})();

function toast(msg,kind='ok'){
  const ico={ok:'fa-circle-check',err:'fa-circle-exclamation',warn:'fa-triangle-exclamation',info:'fa-circle-info'}[kind]||'fa-circle-check';
  const t=document.createElement('div');
  t.className='toast '+kind;
  t.innerHTML=`<i class="fa-solid ${ico}"></i><span>${esc(msg)}</span>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200);},2600);
}

let modalStack=[];
function openModal(html,opts={}){
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="modal ${opts.size||''}">${html}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&opts.dismissible!==false)closeModal();});
  el('modal-root').appendChild(ov);
  modalStack.push(ov);
  const f=ov.querySelector('[data-autofocus]'); if(f)setTimeout(()=>{f.focus();f.select&&f.select();},60);
  if(opts.onOpen)opts.onOpen(ov);
  return ov;
}
function closeModal(){const m=modalStack.pop(); if(m)m.remove();}
function closeAllModals(){modalStack.forEach(m=>m.remove());modalStack=[];}
function topModal(){return modalStack[modalStack.length-1];}
function modalHead(icon,title,sub,color='var(--accent)',bg='var(--accent-soft)'){
  return `<div class="modal-head">
    <div class="card-icon" style="background:${bg};color:${color}"><i class="fa-solid ${icon}"></i></div>
    <div class="spacer"><h3>${esc(title)}</h3>${sub?`<p>${esc(sub)}</p>`:''}</div>
    <button class="x-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
  </div>`;
}
let confirmSeq=0;
function confirmDialog({title,body,confirm='تأكيد',cancel='إلغاء',danger=true,icon='fa-triangle-exclamation',onConfirm}){
  const id='cfm'+(++confirmSeq); window[id]=()=>{closeModal();onConfirm&&onConfirm();};
  openModal(`
    ${modalHead(icon,title,'',danger?'var(--danger)':'var(--warning)',danger?'var(--danger-soft)':'var(--warning-soft)')}
    <div class="modal-body"><p style="font-size:14px;line-height:1.8;color:var(--text-2)">${body}</p></div>

      <button class="btn ${danger?'btn-danger':'btn-primary'}" style="flex:1" onclick="window.${id}()">${esc(confirm)}</button>
    </div>`,{size:''});
}

function field(name,label,{type='text',value='',req=false,ph='',opts=null,rows=0,hint='',attrs=''}={}){
  const lbl=`<label>${esc(label)}${req?' <span class="req">*</span>':''}</label>`;
  let input;
  if(opts) input=`<select class="select" name="${name}">${opts.map(o=>{const v=o.value??o,t=o.label??o;return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`;}).join('')}</select>`;
  else if(rows) input=`<textarea class="input" name="${name}" rows="${rows}" placeholder="${esc(ph)}">${esc(value)}</textarea>`;
  else input=`<input class="input" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" ${attrs}>`;
  return `<div class="field">${lbl}${input}${hint?`<span class="caption" style="font-size:11.5px">${esc(hint)}</span>`:''}<span class="err-msg" data-err="${name}" style="display:none"></span></div>`;
}
function readForm(scope){
  const out={};
  scope.querySelectorAll('input[name],select[name],textarea[name]').forEach(i=>{out[i.name]=i.type==='checkbox'?i.checked:i.value.trim();});
  return out;
}
function validate(scope,rules){
  let ok=true;
  scope.querySelectorAll('[data-err]').forEach(s=>{s.style.display='none';s.textContent='';});
  scope.querySelectorAll('.input,.select').forEach(i=>i.classList.remove('err'));
  for(const [name,checks] of Object.entries(rules)){
    const inp=scope.querySelector(`[name="${name}"]`); if(!inp)continue;
    const v=inp.value.trim();
    let msg='';
    if(checks.req&&!v)msg='هذا الحقل مطلوب';
    else if(v&&checks.num&&isNaN(+v))msg='لازم يكون رقم';
    else if(v&&checks.min!=null&&+v<checks.min)msg=`لازم ${checks.min} أو أكتر`;
    else if(v&&checks.phone&&!/^0\d{8,10}$/.test(v))msg='رقم هاتف غير صحيح';
    else if(v&&checks.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))msg='بريد إلكتروني غير صحيح';
    else if(checks.custom){const c=checks.custom(v);if(c)msg=c;}
    if(msg){ok=false;inp.classList.add('err');const s=scope.querySelector(`[data-err="${name}"]`);if(s){s.textContent=msg;s.style.display='block';}}
  }
  if(!ok)toast('راجع الحقول المعلّمة باللون الأحمر','err');
  return ok;
}

/* ══════════════════════════════════════════════════════════════════════════
   CHARTS (inline SVG)
   ══════════════════════════════════════════════════════════════════════════ */
function lineChart(points,{h=240,color='#6366F1',fill=true,labels=[],fmt=money0}={}){
  if(!points.length)return '';
  const w=760,pl=8,pr=8,pt=14,pb=26;
  const max=Math.max(...points)*1.12||1, min=0;
  const x=i=>pl+(w-pl-pr)*(points.length===1?0.5:i/(points.length-1));
  const y=v=>pt+(h-pt-pb)*(1-(v-min)/(max-min||1));
  const d=points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(' ');
  const area=`${d} L${x(points.length-1).toFixed(1)},${h-pb} L${x(0).toFixed(1)},${h-pb} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  let grid='';
  for(let i=0;i<=3;i++){const gy=pt+(h-pt-pb)*i/3;grid+=`<line class="grid-line" x1="${pl}" y1="${gy}" x2="${w-pr}" y2="${gy}"/>`;}
  let dots=points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2.5"><title>${labels[i]||''}: ${fmt(p)}</title></circle>`).join('');
  let ax=labels.map((l,i)=>points.length>14&&i%Math.ceil(points.length/12)?'':`<text class="axis-txt" x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${fill?`<path d="${area}" fill="url(#${gid})"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${ax}</svg>`;
}
function barChart(items,{h=240,horizontal=false,fmt=money0}={}){
  if(!items.length)return '<div class="empty"><p>لا توجد بيانات</p></div>';
  const max=Math.max(...items.map(i=>i.value))||1;
  if(horizontal){
    return `<div style="display:flex;flex-direction:column;gap:14px">${items.map((it,i)=>`
      <div>
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <span style="font-size:13px;font-weight:500">${esc(it.label)}</span>
          <span style="font-size:13px;font-weight:700">${fmt(it.value)}</span>
        </div>
        <div class="track" style="height:8px"><div style="width:${(it.value/max*100).toFixed(1)}%;background:${it.color||tone(i)}"></div></div>
      </div>`).join('')}</div>`;
  }
  const w=760,pb=28,pt=12,gap=Math.max(4,Math.min(18,600/items.length/3));
  const bw=(w-gap*(items.length+1))/items.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
    ${items.map((it,i)=>{const bh=(h-pt-pb)*(it.value/max);const bx=gap+i*(bw+gap);const by=h-pb-bh;
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,2).toFixed(1)}" rx="5" fill="${it.color||'#6366F1'}" opacity=".92"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>
      <text class="axis-txt" x="${(bx+bw/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(it.short||it.label)}</text>`;}).join('')}
  </svg>`;
}
function donutChart(items,{size=190,thick=26,center=''}={}){
  const total=sum(items,i=>i.value)||1;
  const r=(size-thick)/2, c=2*Math.PI*r;
  let off=0;
  const arcs=items.map((it,i)=>{
    const len=c*(it.value/total);
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${it.color||tone(i)}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt"><title>${esc(it.label)}: ${pct(it.value/total*100)}</title></circle>`;
    off+=len; return s;
  }).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}">${arcs}</svg>
    ${center?`<div class="pie-center">${center}</div>`:''}</div>`;
}

function pageHead(title,sub,actions=''){

function statCard(o){
  return `<div class="stat-card">
    <div class="stat-top">
      <div class="stat-ico" style="background:${soft(o.color,.11)};color:${o.color}"><i class="fa-solid ${o.icon}"></i></div>
      <div class="spacer" style="min-width:0"><div class="stat-title">${esc(o.title)}</div><div class="stat-value">${o.value}</div></div>
    </div>
    ${o.change!=null?`<div class="stat-change">
      <span class="chg ${o.change>0?'up':o.change<0?'down':'flat'}"><i class="fa-solid fa-arrow-${o.change>0?'up':o.change<0?'down':'right'}"></i>${pct(Math.abs(o.change))}</span>
      <span>${esc(o.changeLabel||'عن الفترة السابقة')}</span></div>`:o.foot?`<div class="stat-change"><span class="caption">${o.foot}</span></div>`:''}
  </div>`;
}
function emptyState(icon,title,body,action=''){
  return `<div class="empty"><div class="empty-ico"><i class="fa-solid ${icon}"></i></div><h4>${esc(title)}</h4><p>${esc(body)}</p>${action}</div>`;
}
function pager(total,st,onchange){
  const pages=Math.max(1,Math.ceil(total/st.per));
  if(st.page>pages)st.page=pages;
  const from=total?(st.page-1)*st.per+1:0, to=Math.min(st.page*st.per,total);
  let btns='';
  const add=(p,lbl,dis,act)=>btns+=`<button class="pg ${act?'active':''}" ${dis?'disabled':''} onclick="${onchange}(${p})">${lbl}</button>`;
  add(st.page-1,'<i class="fa-solid fa-chevron-right"></i>',st.page===1,false);
  const list=[];
  for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.page)<=1)list.push(i);else if(list[list.length-1]!=='…')list.push('…');}
  list.forEach(i=>{ if(i==='…')btns+=`<span class="pg" style="border:none;background:none">…</span>`; else add(i,i,false,i===st.page); });
  add(st.page+1,'<i class="fa-solid fa-chevron-left"></i>',st.page===pages,false);
  return `<span>عرض <b>${from}</b>–<b>${to}</b> من <b>${total}</b></span><div class="spacer"></div><div class="pager">${btns}</div>`;
}
function slice(arr,st){return arr.slice((st.page-1)*st.per,st.page*st.per);}
function sortIcon(st,key){return st.sort===key?`<i class="fa-solid fa-arrow-${st.dir>0?'down':'up'}"></i>`:`<i class="fa-solid fa-sort"></i>`;}
function sortBy(arr,st,map){
  const f=map[st.sort]; if(!f)return arr;
  return [...arr].sort((a,b)=>{const x=f(a),y=f(b);
    return (typeof x==='string'?x.localeCompare(y,'ar'):x-y)*st.dir;});
}
function setSort(page,key){const st=U[page];if(st.sort===key)st.dir*=-1;else{st.sort=key;st.dir=1;}rerender();}
function setPage(page,p){U[page].page=p;rerender();}

/* ══════════════════════════════════════════════════════════════════════════
   ANALYTICS — مشتقة من DAILY_SERIES + بيانات الحالة
   ══════════════════════════════════════════════════════════════════════════ */
const RANGES={today:{label:'اليوم',days:1},week:{label:'آخر 7 أيام',days:7},month:{label:'آخر 30 يوم',days:30},quarter:{label:'آخر 90 يوم',days:90},year:{label:'آخر سنة',days:365}};
function series(days,branch='all'){
  const f=branch==='all'?1:(branch==='br-1'?.49:branch==='br-2'?.32:.19);
  return DAILY_SERIES.slice(-days).map(d=>({...d,
    sales:Math.round(d.sales*f),profit:Math.round(d.profit*f),invoices:Math.max(1,Math.round(d.invoices*f)),
    cash:Math.round(d.cash*f),card:Math.round(d.card*f),wallet:Math.round(d.wallet*f),credit:Math.round(d.credit*f)}));
}
function totals(days,branch='all'){
  const cur=series(days,branch);
  const prevAll=series(days*2,branch), prev=prevAll.slice(0,prevAll.length-cur.length);
  const t=a=>({sales:sum(a,x=>x.sales),profit:sum(a,x=>x.profit),invoices:sum(a,x=>x.invoices),
    cash:sum(a,x=>x.cash),card:sum(a,x=>x.card),wallet:sum(a,x=>x.wallet),credit:sum(a,x=>x.credit)});
  const c=t(cur),p=t(prev.length?prev:cur);
  const chg=(a,b)=>b?((a-b)/b*100):0;
  return {cur,points:cur,...c,avg:c.invoices?c.sales/c.invoices:0,margin:c.sales?c.profit/c.sales*100:0,
    d_sales:chg(c.sales,p.sales),d_profit:chg(c.profit,p.profit),d_invoices:chg(c.invoices,p.invoices),
    d_avg:chg(c.invoices?c.sales/c.invoices:0,p.invoices?p.sales/p.invoices:0)};
}
function chartLabels(pts){
  return pts.map(p=>pts.length<=31?`${p.date.getDate()}/${p.date.getMonth()+1}`:AR_MONTHS[p.date.getMonth()].slice(0,4));
}
/* أفضل المنتجات — ترتيب ثابت مشتق من السعر × عامل من الـSKU */
function topProducts(n=8,days=30){
  const rows=S.products.map((p,i)=>{
    const seed=((p.sku.charCodeAt(4)||70)*7+i*13)%37;
    const qty=Math.round((260-seed*5)*(days/30)*(p.price<100?2.4:p.price<500?1:.35));
    return {p,qty:Math.max(3,qty),revenue:Math.max(3,qty)*p.price,profit:Math.max(3,qty)*(p.price-p.cost)};
  }).sort((a,b)=>b.revenue-a.revenue);
  return rows.slice(0,n);
}
function categoryBreakdown(days=30){
  const tp=topProducts(999,days);
  return CATEGORIES.map((c,i)=>({label:c.name,color:tone(i),
    value:sum(tp.filter(r=>r.p.categoryId===c.id),r=>r.revenue)})).sort((a,b)=>b.value-a.value);
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE: POS — نقطة البيع
   ══════════════════════════════════════════════════════════════════════════ */
PAGES.pos=()=>{
  const st=U.pos, c=cart();
  const q=st.q.trim();
  let list=S.products.filter(p=>p.active);
  if(st.cat!=='all')list=list.filter(p=>p.categoryId===st.cat);
  if(q)list=list.filter(p=>p.name.includes(q)||p.sku.toLowerCase().includes(q.toLowerCase())||p.barcode.includes(q));
  const counts=id=>S.products.filter(p=>p.active&&(id==='all'||p.categoryId===id)).length;

  return `<div class="pos">
    <div class="pos-products">
      <div class="pos-search">
        <div class="pos-search-box">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted);font-size:17px"></i>
          <input id="pos-q" placeholder="ابحث بالاسم أو الكود أو امسح الباركود…" value="${esc(st.q)}"
                 oninput="posSearch(this.value)" onkeydown="posSearchKey(event)" autocomplete="off">
          ${st.q?`<button class="x-btn" onclick="posSearch('')"><i class="fa-solid fa-xmark"></i></button>`:'<span class="kbd">F2</span>'}
        </div>
        <button class="scan-btn" onclick="scanDialog()" title="مسح باركود"><i class="fa-solid fa-barcode"></i></button>
      </div>
      <div class="cat-tabs">
        <button class="cat-tab ${st.cat==='all'?'on':''}" onclick="posCat('all')"><i class="fa-solid fa-border-all"></i>الكل <small>${counts('all')}</small></button>
        ${CATEGORIES.map(c2=>`<button class="cat-tab ${st.cat===c2.id?'on':''}" onclick="posCat('${c2.id}')">
          <i class="fa-solid ${c2.icon}"></i>${esc(c2.name)} <small>${counts(c2.id)}</small></button>`).join('')}
      </div>
      ${list.length?`<div class="prod-grid">${list.map(p=>posCard(p)).join('')}</div>`
        :`<div class="card" style="flex:1;display:flex">${emptyState('fa-magnifying-glass','لا توجد نتائج','جرّب كلمة بحث تانية أو غيّر الفئة',
          `<button class="btn btn-secondary accent" onclick="posSearch('')"><i class="fa-solid fa-rotate-left"></i>مسح البحث</button>`)}</div>`}
    </div>
    ${posCart(c)}
  </div>`;
};
PAGES.pos.after=()=>{const i=el('pos-q');if(i&&U.pos.q)i.focus();};

function posCard(p){
  const out=p.stock<=0, col=tone(p.colorIndex), low=p.stock>0&&p.stock<=p.minStock;
  return `<div class="prod-card ${out?'out':''}" ${out?'':`onclick="addToCart('${p.id}')"`} title="${esc(p.name)}">
    <div class="prod-img" style="background:${soft(col,.1)};color:${col}">
      <i class="fa-solid ${catOf(p.categoryId).icon}"></i>
      ${out?`<span class="prod-flag" style="background:var(--danger-soft);color:var(--danger)"><i class="fa-solid fa-ban"></i>نفد</span>`
        :low?`<span class="prod-flag" style="background:var(--warning-soft);color:var(--warning)"><i class="fa-solid fa-triangle-exclamation"></i>${p.stock}</span>`:''}
    </div>
    <div class="prod-body">
      <div class="prod-name">${esc(p.name)}</div>
      <div class="prod-stock">${esc(p.sku)} · ${out?'غير متاح':num(p.stock)+' '+esc(p.unit)}</div>
      <div class="prod-price" style="color:${col}">${money(p.price)}</div>
    </div>
  </div>`;
}

function posCart(c){
  const sub=cSubtotal(c), dis=cDiscount(c), tax=cTax(c), tot=cTotal(c), cust=custOf(c.customerId);
  const disLabel=c.discount.type==='percent'&&c.discount.value>0?` (${trim(c.discount.value)}%)`:'';
  return `<div class="pos-cart">
    <div class="inv-tabs">
      ${POS.carts.map((ct,i)=>`<button class="inv-tab ${i===POS.active?'on':''}" onclick="switchCart(${i})">
        <i class="fa-solid fa-receipt" style="font-size:11px"></i>فاتورة ${ct.number}
        ${ct.items.length?`<span class="n">${cCount(ct)}</span>`:''}
        ${POS.carts.length>1?`<span class="x" onclick="event.stopPropagation();closeCart(${i})"><i class="fa-solid fa-xmark"></i></span>`:''}
      </button>`).join('')}
      <button class="inv-tab" onclick="newCartTab()" title="فاتورة جديدة"><i class="fa-solid fa-plus"></i></button>
      <div class="spacer"></div>
      <button class="held-btn ${POS.held.length?'has':''}" onclick="heldDialog()" title="الفواتير المعلّقة">
        <i class="fa-solid fa-pause"></i>${POS.held.length||''}</button>
    </div>

    <div class="cart-head">
      <div><div class="section-title">فاتورة ${c.number}</div>
        <div class="caption">${cCount(c)} صنف · ${c.items.length} سطر</div></div>
      <div class="spacer"></div>
      ${c.items.length?`<button class="btn-icon danger" onclick="clearCart()" title="تفريغ الفاتورة"><i class="fa-solid fa-trash-can"></i></button>`:''}
    </div>

    <div class="cart-customer">
      <div class="av" style="background:var(--accent-soft);color:var(--accent)"><i class="fa-solid fa-user"></i></div>
      <div class="spacer" style="min-width:0">
        <div class="cell-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(cust.name)}</div>
        <div class="cell-sub">${cust.walkIn?'بدون بيانات':esc(cust.phone)+' · '+num(cust.points)+' نقطة'}</div>
      </div>
      <button class="btn btn-sm btn-secondary accent" onclick="pickCustomer()"><i class="fa-solid fa-repeat"></i>تغيير</button>
    </div>

    <div class="cart-items">
      ${c.items.length?c.items.map((it,i)=>{const p=prodOf(it.pid),col=tone(p.colorIndex);
        return `<div class="cart-line">
          <div class="row gap-md">
            <div class="thumb" style="background:${soft(col,.1)};color:${col};width:34px;height:34px;font-size:14px"><i class="fa-solid ${catOf(p.categoryId).icon}"></i></div>
            <div class="spacer" style="min-width:0">
              <div class="cell-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</div>
              <div class="cell-sub">${money(it.price)} × ${it.qty} ${esc(p.unit)}</div>
            </div>
            <button class="btn-icon danger" onclick="removeLine(${i})"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="row gap-md">
            <div class="qty">
              <button onclick="lineQty(${i},-1)"><i class="fa-solid fa-minus"></i></button>
              <span>${it.qty}</span>
              <button onclick="lineQty(${i},1)"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="spacer"></div>
            <span class="amount" style="font-size:14.5px">${money(it.price*it.qty)}</span>
          </div>
        </div>`;}).join('')
      :emptyState('fa-cart-shopping','السلة فاضية','اضغط على أي منتج عشان تضيفه للفاتورة')}
    </div>

    <div class="cart-summary">
      <div class="sum-row"><span class="k">المجموع الفرعي</span><span class="amount">${money(sub)}</span></div>
      <div class="sum-row"><span class="k">الخصم${disLabel}</span><span class="amount ${dis>0?'text-danger':''}">${dis>0?'− ':''}${money(dis)}</span></div>
      <div class="sum-row"><span class="k">ضريبة القيمة المضافة (${trim(S.settings.taxRate)}%)</span><span class="amount">${money(tax)}</span></div>
      <div class="total-row">
        <div><div class="label">الإجمالي المستحق</div><div class="caption">${cCount(c)} صنف</div></div>
        <div class="amount-hero" style="color:var(--accent)">${money(tot)}</div>
      </div>
      <div class="row gap-md mt-lg">
        <button class="btn btn-secondary" style="flex:1" ${c.items.length?'':'disabled'} onclick="holdInvoice()"><i class="fa-solid fa-circle-pause"></i>تعليق</button>
        <button class="btn btn-secondary accent" style="flex:1" ${c.items.length?'':'disabled'} onclick="discountDialog()"><i class="fa-solid fa-tag"></i>خصم</button>
      </div>
      <button class="btn btn-primary btn-hero btn-block mt-lg" ${c.items.length?'':'disabled'} onclick="paymentDialog()">
        <i class="fa-solid fa-money-bill-wave"></i>الدفع
        ${c.items.length?`<span style="background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px;font-size:14.5px">${money(tot)}</span>`:''}
      </button>
    </div>
  </div>`;
}

/* ─── POS actions ─── */
function posSearch(v){U.pos.q=v;rerender();const i=el('pos-q');if(i){i.focus();i.setSelectionRange(v.length,v.length);}}
function posCat(id){U.pos.cat=id;rerender();}
function posSearchKey(e){
  if(e.key!=='Enter')return;
  const q=U.pos.q.trim(); if(!q)return;
  const exact=S.products.find(p=>p.barcode===q||p.sku.toLowerCase()===q.toLowerCase());
  if(exact){ if(exact.stock<=0){toast('الصنف نفد من المخزون','warn');return;} U.pos.q=''; addToCart(exact.id); return; }
  const one=S.products.filter(p=>p.active&&p.name.includes(q));
  if(one.length===1&&one[0].stock>0){U.pos.q='';addToCart(one[0].id);}
}
function scanDialog(){
  openModal(`${modalHead('fa-barcode','مسح الباركود','وجّه القارئ ناحية الكود أو اكتبه يدويًا')}
    <div class="modal-body">
      <div style="height:150px;border:1.6px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface-alt);display:grid;place-items:center;margin-bottom:var(--s-lg)">
        <div style="text-align:center;color:var(--text-muted)"><i class="fa-solid fa-barcode" style="font-size:44px"></i>
        <div class="caption mt-lg">في انتظار القراءة…</div></div>
      </div>
      ${field('code','كود الباركود',{ph:'6221031001012',attrs:'data-autofocus onkeydown="if(event.key===\'Enter\')doScan()"'})}
      <div class="caption mt-lg">جرّب: ${S.products.slice(0,3).map(p=>`<b style="cursor:pointer;color:var(--accent)" onclick="topModal().querySelector('[name=code]').value='${p.barcode}'">${p.barcode}</b>`).join(' · ')}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" style="flex:1" onclick="doScan()"><i class="fa-solid fa-check"></i>إضافة للفاتورة</button>
    </div>`);
}
function doScan(){
  const code=topModal().querySelector('[name=code]').value.trim();
  const p=S.products.find(x=>x.barcode===code||x.sku.toLowerCase()===code.toLowerCase());
  if(!p){toast('لا يوجد صنف بهذا الكود','err');return;}
  if(p.stock<=0){toast('الصنف نفد من المخزون','warn');return;}
  closeModal(); addToCart(p.id);
}
function addToCart(pid){
  const p=byId(S.products,pid); if(!p)return;
  if(p.stock<=0){toast('الصنف نفد من المخزون','warn');return;}
  const c=cart(), line=c.items.find(i=>i.pid===pid);
  if(line){ if(line.qty>=p.stock){toast('الكمية المتاحة '+p.stock+' فقط','warn');return;} line.qty++; }
  else c.items.push({pid,name:p.name,price:p.price,qty:1});
  rerender();
}
function lineQty(i,d){
  const c=cart(), line=c.items[i]; if(!line)return;
  const p=prodOf(line.pid);
  if(d>0&&line.qty>=p.stock){toast('الكمية المتاحة '+p.stock+' فقط','warn');return;}
  line.qty+=d; if(line.qty<=0)c.items.splice(i,1);
  rerender();
}
function removeLine(i){cart().items.splice(i,1);rerender();}
function clearCart(){
  confirmDialog({title:'تفريغ الفاتورة',body:`هتتشال كل الأصناف من فاتورة ${cart().number}. الإجراء ده مش هيتراجع.`,confirm:'تفريغ',
    onConfirm:()=>{cart().items=[];cart().discount={type:'amount',value:0};rerender();toast('تم تفريغ الفاتورة');}});
}
function switchCart(i){POS.active=i;rerender();}
function newCartTab(){
  if(POS.carts.length>=6){toast('أقصى عدد فواتير مفتوحة 6','warn');return;}
  POS.carts.push(newCart(POS.nextNo++)); POS.active=POS.carts.length-1; rerender(); toast('تم فتح فاتورة جديدة');
}
function closeCart(i){
  const doIt=()=>{POS.carts.splice(i,1);if(POS.active>=POS.carts.length)POS.active=POS.carts.length-1;if(POS.active<0)POS.active=0;rerender();};
  if(POS.carts[i].items.length)
    confirmDialog({title:'إغلاق الفاتورة',body:`فاتورة ${POS.carts[i].number} فيها ${cCount(POS.carts[i])} صنف. لو قفلتها هتضيع — تقدر تعلّقها بدل كده.`,confirm:'إغلاق وحذف',onConfirm:doIt});
  else doIt();
}
function pickCustomer(){
  openModal(`${modalHead('fa-users','اختيار العميل','اربط الفاتورة بعميل عشان النقاط والحساب الآجل')}
    <div class="modal-body" style="padding:var(--s-md)">
      <div style="padding:0 var(--s-sm) var(--s-md)">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
          <input class="input" placeholder="ابحث بالاسم أو رقم الهاتف…" data-autofocus oninput="filterCustPick(this.value)"></div>
      </div>
      <div id="cust-pick">${custPickList('')}</div>
    </div>`,{size:'md'});
}
function custPickList(q){
  const list=S.customers.filter(c=>!q||c.name.includes(q)||c.phone.includes(q));
  if(!list.length)return emptyState('fa-user-slash','لا يوجد عميل بهذا الاسم','جرّب بحث تاني أو أضف عميل جديد من شاشة العملاء');
  return list.map(c=>{const t=tierOf(c);
    return `<button class="nav-tile ${c.id===cart().customerId?'on':''}" onclick="setCustomer('${c.id}')">
      <div class="nav-tile-ico"><i class="fa-solid ${c.walkIn?'fa-user':'fa-user-check'}"></i></div>
      <div class="spacer"><h5>${esc(c.name)}</h5><p>${esc(c.phone)} · ${num(c.points)} نقطة</p></div>
      ${t!=='عادي'?`<span class="badge ${tierTone(t)}">${t}</span>`:''}
    </button>`;}).join('');
}
function filterCustPick(v){el('cust-pick').innerHTML=custPickList(v.trim());}
function setCustomer(id){cart().customerId=id;closeModal();rerender();toast('تم اختيار '+custOf(id).name);}

/* ─── تعليق واسترجاع الفواتير ─── */
function holdInvoice(){
  const c=cart(); if(!c.items.length)return;
  POS.held.push({id:POS.nextHeld++,number:c.number,items:clone(c.items),customerId:c.customerId,discount:clone(c.discount),
    at:new Date().toTimeString().slice(0,5),total:cTotal(c)});
  if(POS.carts.length>1){POS.carts.splice(POS.active,1);POS.active=Math.max(0,POS.active-1);}
  else {c.items=[];c.discount={type:'amount',value:0};c.customerId='c-0';}
  rerender(); toast('تم تعليق الفاتورة — ترجّعها من زرار ⏸ فوق السلة');
}
function heldDialog(){
  openModal(`${modalHead('fa-circle-pause','الفواتير المعلّقة',POS.held.length+' فاتورة في الانتظار','var(--warning)','var(--warning-soft)')}
    <div class="modal-body" style="padding:var(--s-md)">
      <div id="held-list">${heldList()}</div>
    </div>`,{size:'md'});
}
function heldList(){
  if(!POS.held.length)return emptyState('fa-inbox','لا توجد فواتير معلّقة','علّق أي فاتورة من زرار «تعليق» تحت السلة وهتلاقيها هنا');
  return POS.held.map(h=>`<div class="nav-tile" style="cursor:default">
    <div class="nav-tile-ico" style="background:var(--warning-soft);color:var(--warning)"><i class="fa-solid fa-receipt"></i></div>
    <div class="spacer"><h5>فاتورة ${h.number} · ${esc(custOf(h.customerId).name)}</h5>
      <p>${sum(h.items,i=>i.qty)} صنف · ${money(h.total)} · معلّقة ${esc(h.at)}</p></div>
    <button class="btn btn-sm btn-primary" onclick="restoreHeld(${h.id})"><i class="fa-solid fa-rotate-left"></i>استرجاع</button>
    <button class="btn-icon danger" onclick="deleteHeld(${h.id})"><i class="fa-solid fa-trash-can"></i></button>
  </div>`).join('');
}
function restoreHeld(id){
  const i=POS.held.findIndex(h=>h.id===id); if(i<0)return;
  const h=POS.held.splice(i,1)[0];
  if(cart().items.length){ POS.carts.push(newCart(POS.nextNo++)); POS.active=POS.carts.length-1; }
  const c=cart(); c.items=clone(h.items); c.customerId=h.customerId; c.discount=clone(h.discount);
  closeModal(); rerender(); toast('تم استرجاع الفاتورة');
}
function deleteHeld(id){
  const h=POS.held.find(x=>x.id===id);
  confirmDialog({title:'حذف الفاتورة المعلّقة',body:`فاتورة ${h.number} بقيمة ${money(h.total)} هتتحذف نهائيًا.`,confirm:'حذف',

function disPresets(){
  const arr=disType==='amount'?[10,20,50,100]:[5,10,15,20];
  return arr.map(v=>`<button class="chip" style="flex:1;justify-content:center" onclick="setDisVal(${v})">${v}${disType==='amount'?' '+CUR:'%'}</button>`).join('');
}
function setDisType(t){disType=t;const m=topModal();
  m.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(t==='amount')));
  el('dis-suffix').textContent=t==='amount'?CUR:'%'; el('dis-presets').innerHTML=disPresets(); disPreview();}
function setDisVal(v){el('dis-val').value=v;disPreview();}
function disPreview(){
  const c=cart(), sub=cSubtotal(c), raw=+el('dis-val').value||0;
  const amt=Math.min(Math.max(disType==='percent'?sub*raw/100:raw,0),sub);
  const after=sub-amt, tax=after*(S.settings.taxRate/100);
  el('dis-preview').innerHTML=`
    <div class="sum-row"><span class="k">المجموع الفرعي</span><span class="amount">${money(sub)}</span></div>
    <div class="sum-row"><span class="k">قيمة الخصم${disType==='percent'&&raw?` (${trim(raw)}%)`:''}</span><span class="amount text-danger">− ${money(amt)}</span></div>
    <div class="sum-row"><span class="k">الضريبة</span><span class="amount">${money(tax)}</span></div>
    <div class="total-row" style="margin-top:0"><span style="font-weight:700">الإجمالي بعد الخصم</span><span class="amount-lg text-accent">${money(after+tax)}</span></div>
    ${disType==='percent'&&raw>0?`<div class="caption mt-lg"><i class="fa-solid fa-circle-info"></i> النسبة بتتحدّث تلقائيًا لو ضفت أصناف تانية</div>`:''}`;

function applyDiscount(forceZero){
  const c=cart();
  const v=forceZero===0?0:(+el('dis-val').value||0);
  if(v<0){toast('قيمة الخصم لازم تكون موجبة','err');return;}
  if(disType==='percent'&&v>100){toast('النسبة مينفعش تزيد عن 100%','err');return;}
  c.discount={type:disType,value:v};
  closeModal(); rerender();
  toast(v<=0?'تم إلغاء الخصم':'تم تطبيق خصم '+money(cDiscount(c)));
}

function refreshPay(){el('pay-cash').innerHTML=payCashHtml();el('pay-methods').innerHTML=payMethodsHtml();}
function selectMethod(m){
  PAY.method=m;
  if(m!=='cash'){PAY.text=String(PAY.total.toFixed(2));PAY.fresh=true;}
  else{PAY.text='';PAY.fresh=true;}
  refreshPay(); const i=el('pay-amount'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}
}
function payTyped(v){PAY.text=v.replace(/[^\d.]/g,'');PAY.fresh=false;const p=payEntered(),ch=p-PAY.total;
  const box=el('pay-cash'); const inp=el('pay-amount'); const pos=inp?inp.selectionStart:0;
  box.innerHTML=payCashHtml(); const i2=el('pay-amount'); if(i2){i2.focus();try{i2.setSelectionRange(pos,pos);}catch(e){}}}
function payKey(k){
  if(PAY.fresh){PAY.text='';PAY.fresh=false;}
  if(k==='.'&&PAY.text.includes('.'))return;
  if(PAY.text.replace('.','').length>=9)return;
  PAY.text+=k; refreshPayKeep();
}
function payBack(){PAY.text=PAY.text.slice(0,-1);PAY.fresh=false;refreshPayKeep();}
function payClear(){PAY.text='';PAY.fresh=true;refreshPayKeep();}
function payExact(v){PAY.text=String(v.toFixed?v.toFixed(2):v);PAY.fresh=true;refreshPayKeep();}
function refreshPayKeep(){el('pay-cash').innerHTML=payCashHtml();const i=el('pay-amount');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
function confirmPayment(){
  const c=cart(), cu=custOf(c.customerId);
  if(PAY.method==='credit'&&cu.walkIn){toast('اختر عميل مسجّل عشان تعمل بيع آجل','err');return;}
  if(PAY.method==='cash'&&payEntered()<PAY.total-0.005){toast('المبلغ المدفوع أقل من الإجمالي','err');return;}
  const change=PAY.method==='cash'?payEntered()-PAY.total:0;
  const id=nextId('sale','INV-');
  const sale={id,date:ymd(TODAY),time:new Date().toTimeString().slice(0,5),branchId:S.branchId,customerId:c.customerId,
    items:clone(c.items),subtotal:cSubtotal(c),discount:cDiscount(c),tax:cTax(c),total:PAY.total,
    method:PAY.method,methodLabel:PAY_METHODS.find(m=>m.id===PAY.method).label,paid:PAY.method==='cash'?payEntered():PAY.total,change,
    cashier:S.employees[0].name};
  S.sales.unshift(sale);
  // خصم المخزون + نقاط الولاء + رصيد الآجل + إحصائيات الوردية
  c.items.forEach(i=>{const p=byId(S.products,i.pid);if(p)p.stock=Math.max(0,p.stock-i.qty);});
  if(!cu.walkIn){cu.points+=Math.round(PAY.total*POINTS_PER_EGP/10);cu.orders++;cu.totalPurchases+=PAY.total;cu.lastVisit=ymd(TODAY);
    if(PAY.method==='credit')cu.balance-=PAY.total;}
  if(S.shift.open){S.shift.sales+=PAY.total;S.shift.invoices++;S.shift[PAY.method]+=PAY.total;}
  save(); closeModal();
  // إفراغ/قفل التبويب
  if(POS.carts.length>1){POS.carts.splice(POS.active,1);POS.active=Math.max(0,POS.active-1);}
  else{c.items=[];c.discount={type:'amount',value:0};c.customerId='c-0';}
  renderShell(); rerender();
  receiptDialog(sale);
}

function ctDiff(i){
  const inp=topModal().querySelector(`[data-ct="${i}"]`), d=(+inp.value||0)-(+inp.dataset.book);
  const b=el('ct-d-'+i); b.textContent=(d>0?'+':'')+d; b.className='badge '+(d<0?'danger':d>0?'info':'neutral');
}
function saveStocktake(){
  const sc=topModal(), f=readForm(sc);
  let diff=0,value=0,n=0;
  sc.querySelectorAll('[data-ct]').forEach(inp=>{
    const d=(+inp.value||0)-(+inp.dataset.book); n++;
    if(d){diff+=d;const p=S.products[+inp.dataset.ct];value+=d*p.cost;p.stock=+inp.value||0;}
  });
  S.stocktakes.unshift({id:nextId('ct','CNT-'),date:ymd(TODAY),branchId:f.branchId,items:n,diff,value:Math.round(value),status:'approved',by:S.employees[0].name});
  save(); closeModal(); U.inventory.tab='counts'; rerender();
  toast(diff===0?'تم اعتماد الجرد — كل الأصناف مطابقة':`تم اعتماد الجرد — فرق ${diff>0?'+':''}${diff} بقيمة ${money(Math.abs(value))}`);
}

function poReceive(id){
  const po=byId(S.purchaseOrders,id);
  openModal(`${modalHead('fa-truck-ramp-box','استلام بضاعة','أمر الشراء '+po.id+' · '+suppOf(po.supplierId).name,'var(--success)','var(--success-soft)')}

        </tbody></table></div></div>
      <div class="mt-lg">${field('note','ملاحظات الاستلام',{rows:2,ph:'حالة البضاعة، رقم إذن الاستلام…'})}</div>

    </div>`,{size:'lg'});
}
function saveReceive(id){
  const po=byId(S.purchaseOrders,id), sc=topModal();
  let got=0;
  sc.querySelectorAll('[data-recv]').forEach(inp=>{
    const i=+inp.dataset.recv, l=po.lines[i], q=Math.min(+inp.value||0,l.qty-l.recv);
    if(q>0){l.recv+=q;got+=q;const p=byId(S.products,l.pid);if(p)p.stock+=q;}
  });
  if(!got){toast('لم تُدخل أي كمية للاستلام','warn');return;}
  const full=po.lines.every(l=>l.recv>=l.qty);
  po.status=full?'completed':'partiallyReceived';
  save(); closeModal(); rerender();
  toast(`تم استلام ${num(got)} قطعة — ${full?'الأمر مكتمل':'الأمر مستلم جزئيًا'}`);
}

  const po=byId(S.purchaseOrders,id);
  confirmDialog({title:'حذف أمر الشراء',body:`أمر الشراء <b>${esc(po.id)}</b> بقيمة ${money(poTotal(po))} من ${esc(suppOf(po.supplierId).name)} هيتحذف نهائيًا.`,
    confirm:'حذف',onConfirm:()=>{S.purchaseOrders=S.purchaseOrders.filter(x=>x.id!==id);save();rerender();toast('تم حذف '+po.id);}});
}

function poLinesHtml(){
  return poLines.map((l,i)=>`<div class="row gap-md" style="margin-bottom:var(--s-md)">
    <select class="select" style="flex:2" onchange="setPoLine(${i},'pid',this.value)">

function addPoLine(){poLines.push({pid:S.products[0].id,qty:1,cost:S.products[0].cost});refreshPoLines();}
function delPoLine(i){if(poLines.length<2)return;poLines.splice(i,1);refreshPoLines();}
function setPoLine(i,k,v){
  if(k==='pid'){const p=byId(S.products,v);poLines[i].pid=v;poLines[i].cost=p.cost;}
  else poLines[i][k]=+v||0;
  refreshPoLines();
}
function savePo(){
  const sc=topModal(); if(!validate(sc,{expected:{req:true}}))return;
  if(poLines.some(l=>l.qty<1)){toast('كل الأصناف لازم يكون ليها كمية 1 على الأقل','err');return;}
  const f=readForm(sc);
  S.purchaseOrders.unshift({id:nextId('po','PO-'),supplierId:f.supplierId,date:ymd(TODAY),expected:f.expected,
    status:'draft',lines:poLines.map(l=>({pid:l.pid,qty:l.qty,recv:0,cost:l.cost}))});
  const sp=byId(S.suppliers,f.supplierId); sp.orders++;
  save(); closeModal(); U.purchases.page=1; rerender();
  toast('تم إنشاء أمر الشراء بقيمة '+money(sum(poLines,l=>l.qty*l.cost)));
}

function findInvoice(){

  U.returns.reason=RETURN_REASONS[0]; U.returns.method=REFUND_METHODS[0];

function cancelReturn(){U.returns.invoice=null;U.returns.lines=[];U.returns.q='';rerender();}

            <select class="select" onchange="U.returns.reason=this.value">
              ${RETURN_REASONS.map(r=>`<option ${st.reason===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
          <div class="field"><label>طريقة رد المبلغ <span class="req">*</span></label>
            <select class="select" onchange="U.returns.method=this.value">
              ${REFUND_METHODS.map(r=>`<option ${st.method===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
        </div>
        <div class="card card-pad" style="flex:1;min-width:260px;background:var(--surface-alt)">
          <div class="sum-row"><span class="k">عدد الأصناف المرتجعة</span><span class="amount">${sum(st.lines,l=>l.ret)}</span></div>

          <div class="sum-row"><span class="k">الضريبة المستردة</span><span class="amount">${money(refundTax)}</span></div>
          <div class="total-row"><span style="font-weight:700">المبلغ المسترد</span>

          <button class="btn btn-primary btn-block mt-lg" style="background:var(--return)" ${refund>0?'':'disabled'} onclick="submitReturn()">

function toggleRetLine(i){const l=U.returns.lines[i];l.ret=l.ret>0?0:l.qty;rerender();}
function retQty(i,d){const l=U.returns.lines[i];l.ret=Math.max(0,Math.min(l.qty,l.ret+d));rerender();}
function submitReturn(){
  const st=U.returns, refund=sum(st.lines,l=>l.price*l.ret)*(1+S.settings.taxRate/100);
  const items=st.lines.filter(l=>l.ret>0);
  confirmDialog({title:'تأكيد المرتجع',danger:false,icon:'fa-rotate-left',confirm:'تنفيذ المرتجع',
    body:`هيتم إرجاع <b>${sum(items,l=>l.ret)}</b> قطعة من فاتورة <b>${esc(st.invoice.id)}</b> وردّ <b>${money(refund)}</b> عن طريق <b>${esc(st.method)}</b>، والكميات هتترجع للمخزون.`,
    onConfirm:()=>{
      items.forEach(l=>{const p=byId(S.products,l.pid);if(p)p.stock+=l.ret;});
      S.returns.unshift({id:nextId('ret','RET-'),date:ymd(TODAY),invoice:st.invoice.id,customerId:st.invoice.customerId,
        items:items.length,amount:Math.round(refund*100)/100,reason:st.reason,method:st.method,by:S.employees[0].name});
      const c=custOf(st.invoice.customerId);
      if(!c.walkIn&&st.method==='رصيد للعميل')c.balance+=refund;
      save(); cancelReturn(); toast('تم تنفيذ المرتجع وردّ '+money(refund));
    }});
}

function pickPromoType(k){promoType=k;topModal().querySelectorAll('[data-ptype]').forEach(b=>b.classList.toggle('on',b.dataset.ptype===k));}
function savePromo(id){
  const sc=topModal(); if(!validate(sc,{name:{req:true},value:{req:true},scope:{req:true},start:{req:true},
    end:{req:true,custom:v=>v<sc.querySelector('[name=start]').value?'تاريخ النهاية قبل البداية':''}}))return;
  const f=readForm(sc);
  const status=f.start>ymd(TODAY)?'scheduled':f.end<ymd(TODAY)?'expired':'active';
  if(id){Object.assign(byId(S.promotions,id),{name:f.name,type:promoType,value:f.value,scope:f.scope,start:f.start,end:f.end,status});toast('تم حفظ العرض');}

function setDevices(){
  return setCard('fa-plug','الأجهزة المتصلة','حالة أجهزة نقطة البيع',
    DEVICES.map((d,i)=>`<div class="row gap-md" style="padding:var(--s-md) 0;${i<DEVICES.length-1?'border-bottom:1px solid var(--border)':''}">
      <div class="card-icon" style="background:${d.connected?'var(--success-soft)':'var(--surface-alt)'};color:${d.connected?'var(--success)':'var(--text-muted)'}"><i class="fa-solid ${d.icon}"></i></div>
      <div class="spacer"><div class="cell-main">${esc(d.type)}</div><div class="cell-sub">${esc(d.model)} · ${esc(d.port)}</div></div>
      <span class="badge ${d.connected?'success':'neutral'}"><span class="dot"></span>${d.connected?'متصل':'غير متصل'}</span>
      <button class="btn btn-sm btn-secondary" onclick="testDevice('${esc(d.type)}',${d.connected})"><i class="fa-solid fa-vial"></i>اختبار</button>
    </div>`).join(''),
    `<button class="btn btn-secondary" style="flex:1" onclick="toast('جاري البحث عن أجهزة جديدة…','info')"><i class="fa-solid fa-magnifying-glass"></i>البحث عن أجهزة</button>`);
}
function testDevice(type,ok){toast(ok?'تم اختبار '+type+' بنجاح':type+' غير متصل — راجع الكابل والمنفذ',ok?'ok':'err');}
function setSystem(){
  const s=S.settings;
  return `${setCard('fa-gear','إعدادات النظام','التنبيهات والصوت',`
    ${toggleRow('تنبيه نقص المخزون','إشعار لما أي صنف يوصل الحد الأدنى','lowStockAlert',s.lowStockAlert)}
    ${toggleRow('أصوات النظام','صوت عند إضافة صنف أو إتمام عملية','soundOn',s.soundOn)}`)}
  <div class="card mt-lg"><div class="card-head"><div class="card-icon" style="background:var(--danger-soft);color:var(--danger)"><i class="fa-solid fa-database"></i></div>
    <div><div class="card-title">البيانات</div><div class="caption">النسخة التجريبية بتحفظ كل تعديلاتك في متصفحك (localStorage)</div></div></div>
    <div class="card-pad">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-md)" class="mb-lg">
        <div class="card card-pad"><div class="label">الأصناف</div><div class="amount-lg">${num(S.products.length)}</div></div>
        <div class="card card-pad"><div class="label">العملاء</div><div class="amount-lg">${num(S.customers.length-1)}</div></div>
        <div class="card card-pad"><div class="label">فواتير الجلسة</div><div class="amount-lg">${num(S.sales.length)}</div></div>
      </div>
      <div class="row gap-md" style="flex-wrap:wrap">
        <button class="btn btn-secondary accent" onclick="exportData()"><i class="fa-solid fa-file-arrow-down"></i>تصدير نسخة احتياطية</button>
        <button class="btn btn-secondary danger" onclick="resetDemo()"><i class="fa-solid fa-rotate-left"></i>إعادة تعيين البيانات التجريبية</button>
      </div>
      <div class="caption mt-lg"><i class="fa-solid fa-circle-info"></i> إعادة التعيين هتمسح كل الإضافات والتعديلات وترجّع البيانات الأصلية.</div>
    </div></div>`;
}
function exportData(){toast('تم تجهيز نسخة احتياطية بـ'+(S.products.length+S.customers.length+S.expenses.length)+' سجل');}
function resetDemo(){
  confirmDialog({title:'إعادة تعيين البيانات',confirm:'إعادة التعيين',
    body:'كل المنتجات والعملاء والفواتير والإعدادات اللي عدّلتها هترجع لحالتها الأصلية. الإجراء ده مش هيتراجع.',
    onConfirm:()=>{resetAll();POS.carts=[newCart(1)];POS.held=[];POS.active=0;POS.nextNo=2;renderShell();go('welcome');toast('تم إرجاع البيانات التجريبية للحالة الأصلية');}});
}

/* ══════════════════════════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='F2'){e.preventDefault();if(route!=='pos')go('pos');const i=el('pos-q');if(i)i.focus();return;}
  if(e.key==='F4'&&route==='pos'&&cart().items.length){e.preventDefault();paymentDialog();return;}
  if(typing||modalStack.length)return;
  if(e.key==='/'){e.preventDefault();const s=document.querySelector('.search-box .input');if(s)s.focus();}
});

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
(function boot(){
  const h=location.hash.replace('#/','');
  route=(h&&PAGES[h])?h:'welcome';
  renderShell();
  go(route,true);
})();

</script>
</body>
</html>
