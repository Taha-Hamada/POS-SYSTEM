name: Windows Desktop Build

on:
  push:
    # كل push على main بيبني نسخة جديدة
    branches: [main]
    # ولو عملت tag بصيغة v1.0.0 بيعمل كمان Release بلينك تحميل ثابت
    tags: ['v*']
  # وتقدر تشغّله يدوي من تبويب Actions
  workflow_dispatch:
    inputs:
      api_base_url:
        description: >-
          عنوان الباك اند من غير /api/v1 (مثال http://192.168.1.5:5000).
          سيبه فاضي لو السيرفر شغال على نفس الجهاز.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # من غير عنوان، التطبيق بيكلّم http://localhost:5000 زي ما هو مكتوب
      # في ApiConfig.
      - name: Build Windows release
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.api_base_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            flutter build windows --release
          } else {
            flutter build windows --release --dart-define=API_BASE_URL=$url
          }

      # الناتج بيطلع في build/windows/x64/runner/Release
      - name: Package as zip
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (-not (Test-Path $out)) { throw "مجلد الـRelease مش موجود: $out" }

          # مكتبات تشغيل C++ لازم تمشي مع البرنامج، وإلا الجهاز اللي معندهوش
          # Visual C++ Redistributable مش هيفتحه.
          $crt = Get-ChildItem -Path `
            "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
            -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1

          if ($crt) {
            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $file = Join-Path $crt.FullName $dll
              if (Test-Path $file) { Copy-Item $file -Destination $out -Force }
            }
            Write-Host "اتنسخت مكتبات التشغيل من $($crt.FullName)"
          } else {
            Write-Warning "مالقيتش مكتبات VC++ — الجهاز محتاج Visual C++ Redistributable"
          }

          @"
          نظام نقاط البيع — نسخة ويندوز
          ================================
          1) شغّل الباك اند الأول على نفس الجهاز:
               cd pos_system_backend
               npm install
               npm run seed   (أول مرة بس)
               npm run dev
             لازم يكون MongoDB شغال، والسيرفر بيسمع على http://localhost:5000

          2) افتح pos_system.exe من نفس الفولدر ده (سيبه كامل زي ما هو،
             الملفات جنبه ضرورية).

          3) الدخول: admin / Admin@12345

          لو الباك اند على جهاز تاني، شغّل الـworkflow من تبويب Actions
          واكتب عنوانه في خانة api_base_url وهيتبني بيه.
          "@ | Set-Content -Path "$out/اقرأني.txt" -Encoding UTF8

          Compress-Archive -Path "$out/*" -DestinationPath "pos_system_windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos_system_windows
          path: pos_system_windows.zip
          retention-days: 30

      # الـRelease بيتعمل بس لما تعمل push لـtag زي v1.0.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pos_system_windows.zip
          generate_release_notes: true
